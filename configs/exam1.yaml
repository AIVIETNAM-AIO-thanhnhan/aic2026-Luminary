# AIC 2026 configuration.
# Paths may be absolute or relative to the repo root.

paths:
  data_root: data_exam1
  raw:
    videos: data_exam1/raw/videos
    # Each organizer zip extracts with its own wrapper folder (keyframes/,
    # clip-features-32/, objects/, map-keyframes/) instead of landing flat -
    # these paths point past that wrapper at the actual per-video files.
    keyframes: data_exam1/raw/keyframes/keyframes
    objects: data_exam1/raw/objects/objects
    clip_features: data_exam1/raw/clip-features/clip-features-32
    metadata: data_exam1/raw/metadata/map-keyframes
  derived:
    root: data_exam1/derived
    catalog: data_exam1/derived/catalog.parquet
    embeddings: data_exam1/derived/embeddings
    asr: data_exam1/derived/asr/asr.parquet
    ocr: data_exam1/derived/ocr/ocr.parquet
    index: data_exam1/derived/index
    text_db: data_exam1/derived/index/text.sqlite
    objects_db: data_exam1/derived/index/objects.sqlite
  submissions: submissions

# Which embedding space the local FAISS index is built from.
# `btc_clip`  -> the ViT-B/32 .npy files shipped by the organizers (M1 baseline)
# `siglip`    -> embeddings.npy produced by notebooks/01_siglip.ipynb (M2)
embedding:
  active: siglip
  spaces:
    btc_clip:
      dim: 512
      model_id: openai/clip-vit-base-patch32
      # clip-features-32/*.npy covers the whole batch, but the catalog only
      # covers whichever keyframe zips are downloaded so far - this is a single
      # file assembled (in gid order) to match the catalog exactly. Rebuild it
      # with scripts/assemble_btc_clip.py after every `aic build-catalog`.
      source: data_exam1/derived/embeddings/btc_clip_active.npy
    siglip:
      dim: 1152
      model_id: google/siglip2-so400m-patch14-384
      source: data_exam1/derived/embeddings/siglip

# Reciprocal Rank Fusion. score = sum over branches of weight / (k + rank).
# k=60 is the value from the original RRF paper; it damps the tail so a single
# branch cannot dominate on rank alone.
fusion:
  rrf_k: 60
  weights:
    visual: 1.0
    ocr: 1.0
    asr: 0.8
    # Empirically (this batch), CLIP B/32 visual similarity has near-zero
    # precision on these long compositional Vietnamese queries, while a rare,
    # confidently-detected object class (e.g. "Lion" in 6/177k frames) is a much
    # stronger signal. Weighted above visual so a correct object match is not
    # buried under a wrong-but-confident visual one; still additive with the
    # other branches rather than replacing them.
    object: 1.5
    # A satisfied "hơn N người" (more than N people) instance-count constraint is
    # rarer and more specific than a plain object-presence match (see
    # aic.query.search.SearchEngine._object_count_branch), so it is weighted
    # above even the object branch.
    object_count: 2.0
  candidates_per_branch: 500

# Per-query answer list construction. See src/aic/submit/policy.py.
submission:
  max_answers: 100
  # Ranks 1..diversify_head must come from distinct videos: a wrong video scores
  # 0, so spreading the head is the cheapest hedge available.
  diversify_head: 5
  # For KIS/VQA: how many frames to emit per selected shot, and how far apart.
  frames_per_shot: 3
  frame_spread: 8
  # For TRAKE: jitter offsets (in frames) applied to each event index on the
  # lower-ranked duplicate rows, exploiting per-event partial credit.
  trake_jitter: [0, -4, 4, -8, 8, -12, 12]

# TRAKE stage 2: dense re-extraction window around each coarse event hit.
trake:
  window_seconds: 2.0
  max_candidate_videos: 5
  # Extract every Nth frame in the window (1 = native fps, the most precise).
  frame_step: 1

query:
  # Competition queries are Vietnamese; CLIP/SigLIP text towers are English-centric.
  translate_to_english: true
  llm_model: gemini-flash-lite-latest
  num_expansions: 3

verify:
  # Frame-alignment check (src/aic/data_exam1/verify.py).
  sample_size: 20
  # Mean absolute pixel error below which an extracted frame is considered a
  # match for the stored keyframe. JPEG recompression alone stays well under 8.
  mae_threshold: 8.0
  offsets_to_try: [0, -1, 1, -2, 2]
